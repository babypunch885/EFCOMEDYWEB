<script>
  console.log(localStorage.getItem('Vanitybank'))
  document.getElementById('counter').textContent = localStorage.getItem('Vanitybank');
  const button = document.querySelector('.tapthat');
  const counter = document.getElementById('counter');
  let count = localStorage.getItem('Vanitybank')
    if (count === null) {
      count = 0;
    }
    count = Number (count);
  button.addEventListener('click', function() {
    count++;
    counter.textContent = count;
    localStorage.setItem('Vanitybank', count);
  });
